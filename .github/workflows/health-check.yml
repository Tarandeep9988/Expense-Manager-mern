name: Health Check Ping

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping-health:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping Health Endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://expense-manager-42ya.onrender.com/health)
          echo "Health check response: $response"
          
          if [ $response -eq 200 ]; then
            echo "✅ Service is healthy"
          else
            echo "⚠️ Service returned status code: $response"
            exit 1
          fi
